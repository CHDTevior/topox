<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TopX — Figure 1 (ALIGN method-figure-loop)</title>
<style>
  body { margin: 0; background: #f2f2f2; font: 14px/1.4 "Nimbus Roman", "Times New Roman", Times, serif; color: #222; }
  #host canvas { width: 900px; height: 500px; display: block; margin: 16px auto 8px; background: #fff; box-shadow: 0 0 0 1px #ccc; }
  #controls { width: 900px; margin: 0 auto 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #controls button { font: inherit; padding: 2px 8px; } #controls button.on { background: #1F6F8B; color: #fff; }
  #scrub { flex: 1; } #svg-host, #svg-out { display: none; } body.svgonly > * { display: none; } body.svgonly #svg-out { display: block; }
  #err { color: #b00; white-space: pre-wrap; width: 900px; margin: 0 auto; }
</style>
<script src="vendor/p5.min.js"></script>
<script src="vendor/p5.svg.js"></script>
<script src="thumbs.js"></script>
<script>
// p5.js-svg 1.5.1 with p5 1.9.4 wrapper (from ALIGN's example page): p5's transpiled Renderer2D constructor returns a NEW object
// which p5.svg discards; return the object p5 actually built, and give svgcanvas an ellipse() (p5 1.9 draws circle/arc through it).
(function () {
  const OrigSVG = p5.RendererSVG;
  p5.RendererSVG = function (elt, pInst, isMain) {
    const R2D = p5.Renderer2D; let made = null;
    const Tmp = function () { made = R2D.apply(this, arguments); return made; };
    Tmp.prototype = R2D.prototype; p5.Renderer2D = Tmp;
    let shell; try { shell = new OrigSVG(elt, pInst, isMain); } finally { p5.Renderer2D = R2D; }
    Object.setPrototypeOf(made, OrigSVG.prototype);
    made.isSVG = shell.isSVG; made.svg = shell.svg;
    const ctxProto = Object.getPrototypeOf(made.drawingContext);
    if (!ctxProto.ellipse) ctxProto.ellipse = function (x, y, rx, ry, rot, a0, a1, ccw) {
      rot = rot || 0; if (a0 === undefined) { a0 = 0; a1 = Math.PI * 2; }
      const TAU = Math.PI * 2; let span = a1 - a0;
      if (!ccw) { if (span < 0) span += TAU * Math.ceil(-span / TAU); if (span > TAU) span = TAU; }
      else { if (span > 0) span -= TAU * Math.ceil(span / TAU); if (span < -TAU) span = -TAU; }
      const n = Math.max(8, Math.ceil(Math.abs(span) / TAU * 72));
      for (let i = 0; i <= n; i++) { const a = a0 + span * i / n, px = rx * Math.cos(a), py = ry * Math.sin(a);
        const X = x + px * Math.cos(rot) - py * Math.sin(rot), Y = y + px * Math.sin(rot) + py * Math.cos(rot);
        if (i === 0) this.moveTo(X, Y); else this.lineTo(X, Y); }
    };
    return made;
  };
  p5.RendererSVG.prototype = OrigSVG.prototype;
})();
</script>
</head>
<body>
<div id="host"></div>
<div id="controls">
  <button data-stage="1">regions</button><button data-stage="2">token grid</button><button data-stage="3">illustrations &amp; callouts</button>
  <button data-stage="4">connections</button><button data-stage="5">labels</button>
  <input type="range" id="scrub" min="0" max="1000" value="1000"><span id="pval">p = 1.000</span><button id="export">export SVG</button>
</div>
<div id="svg-host"></div><div id="svg-out"></div><pre id="err"></pre>
<script>
window.addEventListener('error', e => { document.getElementById('err').textContent += e.message + ' @' + (e.filename||'').split('/').pop() + ':' + e.lineno + '\n'; });
// TopX Figure 1 as a p5 program (ALIGN trial, v6 = redesign: tinted stage bands, three accents, bold glyphs, straight lanes,
// boxes sized to their text, icons for frozen / tree / time). Every mark is {stage, draw(g)}; all geometry is decided at build time.
const W = 1800, H = 1000, NSTAGE = 5;
const FACE = 'Nimbus Roman';
const S_HEAD = 40, S_LAB = 34, S_SUB = 32;
const TEAL = '#1F7F93', TEAL_D = '#0E4F5E', TEAL_BG = '#D7ECF0', INDIGO = '#5B5FA8', INDIGO_L = '#C9CAE6', INDIGO_BG = '#EBEBF6',
      CLAY = '#B5552F', CLAY_BG = '#F8E5DA', INK = '#2B2B2B', GREY = '#6E6E6E', CELL = '#DADADA';
const BAND = ['#F7F2EA', '#EDF4F6', '#F0EFF8', '#FAF1EB'];          // one very light tint per stage: sand, mist, lavender, clay
const T = {}; let MARKS = null, P = 1, main = null, svgInst = null;

// ---------- primitives ----------
function txt(g, s, x, y, size, opts) {
  opts = opts || {}; g.push(); g.noStroke(); g.fill(opts.col || INK); g.textFont(FACE); g.textSize(size);
  g.textStyle(opts.bold ? g.BOLD : (opts.italic ? g.ITALIC : g.NORMAL)); g.textAlign(opts.align || g.LEFT, opts.valign || g.BASELINE);
  if (opts.rot) { g.translate(x, y); g.rotate(opts.rot); g.text(s, 0, 0); } else g.text(s, x, y); g.pop();
}
function measure(s, str, size, bold) { s.push(); s.textFont(FACE); s.textSize(size); s.textStyle(bold ? s.BOLD : s.NORMAL); const w = s.textWidth(str); s.pop(); return w; }
function rrect(g, x, y, w, h, opts) { opts = opts || {}; g.push(); if (opts.stroke) { g.stroke(opts.stroke); g.strokeWeight(opts.sw || 3); } else g.noStroke(); g.fill(opts.fill || '#fff'); g.rect(x, y, w, h, opts.r === undefined ? 10 : opts.r); g.pop(); }
function cell(g, x, y, w, h, col) { g.push(); g.noStroke(); g.fill(col); g.rect(x, y, w, h, 3); g.pop(); }
function line(g, pts, col, sw, head) {
  g.push(); g.stroke(col); g.strokeWeight(sw); g.noFill(); g.strokeJoin(g.ROUND); g.strokeCap(g.ROUND);
  g.beginShape(); for (const p of pts) g.vertex(p[0], p[1]); g.endShape(); g.pop();
  if (head) { const a = pts[pts.length - 2], b = pts[pts.length - 1], ang = Math.atan2(b[1] - a[1], b[0] - a[0]), L = head;
    g.push(); g.noStroke(); g.fill(col); g.translate(b[0], b[1]); g.rotate(ang); g.triangle(0, 0, -L, -L * 0.42, -L, L * 0.42); g.pop(); }
}
function img(g, name, x, y, w) { const im = T[name]; if (!im) return 0; const h = w * im.height / im.width; g.image(im, x, y, w, h); return h; }
function imgH(name, w) { const im = T[name]; return im ? w * im.height / im.width : 0; }
function plus(g, x, y, col) { g.push(); g.stroke(col); g.strokeWeight(3); g.fill('#fff'); g.circle(x, y, 40); g.strokeWeight(3.5); g.line(x - 11, y, x + 11, y); g.line(x, y - 11, x, y + 11); g.pop(); }
function port(g, x, y) { g.push(); g.stroke(CLAY); g.strokeWeight(3); g.fill(CLAY_BG); g.rect(x - 11, y - 11, 22, 22, 3); g.pop(); }
function lock(g, x, y, k) {   // a small padlock: shackle + body; k = scale
  g.push(); g.noFill(); g.stroke(GREY); g.strokeWeight(2.5 * k); g.arc(x, y - 9 * k, 16 * k, 18 * k, Math.PI, 2 * Math.PI); g.fill(GREY); g.noStroke(); g.rect(x - 11 * k, y - 4 * k, 22 * k, 18 * k, 3 * k); g.pop();
}
function treeIcon(g, x, y, col) {   // a small kinematic tree: root, two children, four leaves
  g.push(); g.stroke(col); g.strokeWeight(3); const p = [[x, y - 26], [x - 16, y - 4], [x + 16, y - 4], [x - 24, y + 20], [x - 8, y + 20], [x + 8, y + 20], [x + 24, y + 20]];
  const e = [[0, 1], [0, 2], [1, 3], [1, 4], [2, 5], [2, 6]]; for (const [a, b] of e) g.line(p[a][0], p[a][1], p[b][0], p[b][1]);
  g.noStroke(); g.fill(col); for (const q of p) g.circle(q[0], q[1], 9); g.pop();
}
function dial(g, x, y) { g.push(); g.stroke(CLAY); g.strokeWeight(3); g.fill(CLAY_BG); g.circle(x, y, 40); g.line(x, y, x + 10, y - 12); g.pop(); txt(g, 't', x - 4, y + 24, 30, { col: CLAY, italic: true, align: g.CENTER }); }
function miniGrid(g, x, y, mode, hi) {   // 6 x 3 cells; a row (a joint over frames) or a column (a frame over joints) highlighted
  const cw = 22, ch = 18, gap = 5;
  for (let c = 0; c < 6; c++) for (let r = 0; r < 3; r++) { const on = mode === 'row' ? r === 1 : c === 2; cell(g, x + c * (cw + gap), y + r * (ch + gap), cw, ch, on ? hi : CELL); }
  g.push(); g.stroke(hi); g.strokeWeight(3);
  if (mode === 'row') g.line(x, y + (ch + gap) + ch / 2, x + 6 * (cw + gap) - gap, y + (ch + gap) + ch / 2);
  else g.line(x + 2 * (cw + gap) + cw / 2, y, x + 2 * (cw + gap) + cw / 2, y + 3 * (ch + gap) - gap);
  g.pop();
}
// a box sized to its label: returns {x,y,w,h,cx,cy}; label(s) drawn by the labels stage via box.draw
function makeBox(s, x, y, lines, opts) {
  opts = opts || {}; const size = opts.size || S_SUB, pad = opts.pad === undefined ? 16 : opts.pad, lh = size * 1.12;
  const tw = Math.max(...lines.map(l => measure(s, l, size, opts.bold))) + (opts.icon ? 40 : 0);
  const w = Math.max(opts.minW || 0, tw + 2 * pad), h = lines.length * lh + 2 * pad - size * 0.2;
  return { x, y, w, h, cx: x + w / 2, cy: y + h / 2, lines, size, opts };
}
function drawBoxFrame(g, b) { rrect(g, b.x, b.y, b.w, b.h, { stroke: b.opts.stroke || INK, sw: b.opts.sw || 2.5, fill: b.opts.fill || '#fff', r: 9 }); }
function drawBoxText(g, b) {
  const size = b.size, lh = size * 1.12, n = b.lines.length, x0 = b.cx - (b.opts.icon ? 20 : 0);
  b.lines.forEach((l, i) => txt(g, l, x0, b.cy + (i - (n - 1) / 2) * lh + size * 0.36, size, { col: b.opts.col || INK, align: g.CENTER }));
  if (b.opts.icon === 'lock') lock(g, b.x + b.w - 30, b.cy, 1.0);
}

// ---------- layout ----------
const BANDS = [{ x: 30, w: 470, title: 'Any rig' }, { x: 520, w: 490, title: 'Skeleton as context' }, { x: 1030, w: 368, title: 'Transformer' }, { x: 1412, w: 358, title: 'Sample & decode' }];
const GR = { x0: 590, y0: 318, colW: 60, gap: 10, rowH: 32, rowGap: 6, rows: 11, cols: 6 };
const gridRight = GR.x0 + GR.cols * GR.colW + (GR.cols - 1) * GR.gap, gridBottom = GR.y0 + GR.rows * GR.rowH + (GR.rows - 1) * GR.rowGap;
const rowY = r => GR.y0 + r * (GR.rowH + GR.rowGap); const HROW = 7; const tgtLeft = GR.x0 + GR.colW + GR.gap; const LOOP_X = GR.x0 + 5 * (GR.colW + GR.gap) + GR.colW / 2;
const BLK = { x: 1050, y: 125, w: 300, h: 500 }; const RAIL_X = BLK.x + BLK.w + 22;
const SUB = [{ y: 160, h: 170, name: 'temporal attention', sub: 'a joint over frames', icon: 'row' }, { y: 348, h: 200, name: 'spatial attention', sub: 'a frame over joints', icon: 'col' }, { y: 566, h: 46, name: 'MLP', sub: '', icon: null }];

function buildMarks(s) {
  const M = []; const add = (stage, draw) => M.push({ stage, draw });
  // boxes (sized to text) — joint-language lane (stage 1, bottom) and caption lane (stage 3, bottom)
  const bDesc = makeBox(s, 50, 660, ['joint', 'descriptions'], { stroke: TEAL, fill: TEAL_BG, col: TEAL_D });
  const bLLMa = makeBox(s, bDesc.x + bDesc.w + 26, 660 + bDesc.h / 2 - 42, ['LLM2Vec'], { icon: 'lock', stroke: GREY, sw: 2, pad: 12 }); bLLMa.h = 84; bLLMa.cy = bLLMa.y + 42;
  const plusJ = [bLLMa.x + bLLMa.w + 50, bLLMa.cy];
  const bMLPt = makeBox(s, bLLMa.x, 790, ['MLP'], { stroke: INK, sw: 2.5, minW: 96 }); bMLPt.h = 52; bMLPt.cy = bMLPt.y + 26;
  const treeXY = [bDesc.cx, 816];
  const bCap = makeBox(s, BLK.x - 12, 690, ['“the moose runs and', 'then slows to a walk”'], { stroke: CLAY, fill: CLAY_BG, col: CLAY, pad: 14 });
  const bLLMb = makeBox(s, BLK.x - 12, 810, ['LLM2Vec'], { icon: 'lock', stroke: GREY, sw: 2, pad: 12 }); bLLMb.h = 84; bLLMb.cy = bLLMb.y + 42;
  const bMLPc = makeBox(s, bLLMb.x + bLLMb.w + 22, bLLMb.cy - 26, ['MLP'], { minW: 78, pad: 8 }); bMLPc.h = 52; bMLPc.cy = bMLPc.y + 26;
  const plusC = [RAIL_X, bMLPc.cy];
  const bMLPtime = makeBox(s, bMLPc.x, 906, ['MLP'], { minW: 78, pad: 8 }); bMLPtime.h = 52; bMLPtime.cy = bMLPtime.y + 26;
  const dialXY = [BLK.x + 44, bMLPtime.cy];
  const bUnseen = makeBox(s, 1424, 836, ['unseen rig: same pass;', 'optional LoRA, ~10 clips'], { stroke: TEAL, sw: 2.5, col: INK, pad: 14 });
  // ---- stage 1: bands, titles, panels ----
  BANDS.forEach((b, i) => add(1, g => { rrect(g, b.x, 40, b.w, 930, { fill: BAND[i], r: 18 }); }));
  BANDS.forEach((b, i) => add(1, g => { g.push(); g.noStroke(); g.fill(i === 3 ? CLAY : i === 2 ? INDIGO : TEAL); g.circle(b.x + 36, 82, 34); g.pop(); txt(g, String(i + 1), b.x + 36, 93, 26, { col: '#fff', bold: true, align: g.CENTER }); txt(g, b.title, b.x + 62, 96, S_HEAD, { bold: true }); }));
  add(1, g => { rrect(g, BLK.x + 10, BLK.y + 10, BLK.w, BLK.h, { fill: '#E4E3EF', r: 12 }); rrect(g, BLK.x, BLK.y, BLK.w, BLK.h, { stroke: INK, sw: 3, fill: '#fff', r: 12 }); });
  for (const sb of SUB) add(1, g => rrect(g, BLK.x + 22, sb.y, BLK.w - 56, sb.h, { stroke: sb.icon === 'col' ? INDIGO : INK, sw: 2.5, fill: sb.icon === 'col' ? INDIGO_BG : '#fff', r: 8 }));
  for (const b of [bDesc, bLLMa, bMLPt, bCap, bLLMb, bMLPc, bMLPtime, bUnseen]) add(1, g => drawBoxFrame(g, b));
  add(1, g => { rrect(g, BLK.x + 16, BLK.y + 12, 64, 30, { fill: INK, r: 15 }); });
  // ---- stage 2: token grid ----
  for (let c = 0; c < GR.cols; c++) for (let r = 0; r < GR.rows; r++) add(2, g => cell(g, GR.x0 + c * (GR.colW + GR.gap), rowY(r), GR.colW, GR.rowH, c === 0 ? TEAL : INDIGO_L));
  add(2, g => { g.push(); g.noFill(); g.stroke(TEAL_D); g.strokeWeight(4); g.rect(GR.x0 - 8, rowY(HROW) - 5, gridRight - GR.x0 + 16, GR.rowH + 10, 5); g.pop(); });
  add(2, g => { g.push(); g.stroke(GREY); g.strokeWeight(2); g.noFill(); const y = gridBottom + 14; g.line(tgtLeft, y, gridRight, y); g.line(tgtLeft, y - 8, tgtLeft, y); g.line(gridRight, y - 8, gridRight, y); g.pop(); });
  // ---- stage 3: illustrations ----
  add(3, g => img(g, 'rig_moose', 60, 118, 360));
  add(3, g => img(g, 'rig_gharial', 50, 400, 215)); add(3, g => img(g, 'rig_lemur', 270, 386, 215));
  add(3, g => img(g, 'rest', GR.x0 - 30, 160, 120));
  [[690, 172, 85], [780, 172, 85], [870, 172, 85]].forEach(([x, y, w], k) => add(3, g => img(g, 'noisy_' + k, x, y, w)));
  SUB.forEach(sb => { if (sb.icon) add(3, g => miniGrid(g, BLK.x + 40, sb.y + 92, sb.icon, INDIGO)); });
  add(3, g => img(g, 'bias', BLK.x + 206, SUB[1].y + 88, 62));
  [[1420, 190], [1505, 190], [1590, 190], [1675, 190]].forEach(([x, y], k) => add(3, g => img(g, 'clean_' + k, x, y, 82)));
  add(3, g => img(g, 'motion_strip', 1418, 350, 340));
  add(3, g => img(g, 'skinned_moose', 1480, 545, 190));
  add(3, g => treeIcon(g, treeXY[0], treeXY[1], TEAL));
  // ---- stage 4: connections (straight, at most one corner each) ----
  add(4, g => line(g, [[428, 300], [GR.x0 - 8, 300]], TEAL, 4, 16));                                                        // rest pose -> rest column
  add(4, g => line(g, [[268, 500], [GR.x0 - 8, 500]], TEAL, 4, 16));                                                          // other rigs -> the same column (one line, both glyphs sit on it)
  add(4, g => line(g, [[GR.x0 + 30, 160 + imgH('rest', 120) + 2], [GR.x0 + GR.colW / 2, GR.y0 - 8]], TEAL, 4, 14));           // the rest glyph is the first column
  add(4, g => line(g, [[bDesc.x + bDesc.w + 4, bLLMa.cy], [bLLMa.x - 6, bLLMa.cy]], TEAL, 3.5, 14));
  add(4, g => line(g, [[bLLMa.x + bLLMa.w + 4, bLLMa.cy], [plusJ[0] - 24, plusJ[1]]], TEAL, 3.5, 14));
  add(4, g => line(g, [[treeXY[0] + 30, treeXY[1]], [bMLPt.x - 6, treeXY[1]]], TEAL, 3.5, 14));                                 // tree -> MLP
  add(4, g => line(g, [[bMLPt.x + bMLPt.w + 4, bMLPt.cy], [plusJ[0], bMLPt.cy], [plusJ[0], plusJ[1] + 24]], TEAL, 3.5, 14));   // MLP -> sum (one corner)
  add(4, g => line(g, [[plusJ[0] + 22, plusJ[1]], [565, plusJ[1]], [565, rowY(HROW) + GR.rowH / 2], [GR.x0 - 12, rowY(HROW) + GR.rowH / 2]], TEAL, 3.5, 14));   // sum -> the joint's row
  add(4, g => line(g, [[gridRight + 8, rowY(0) + GR.rowH / 2], [BLK.x - 6, rowY(0) + GR.rowH / 2]], INK, 5, 18));            // tokens -> transformer (top row = temporal attention level)
  add(4, g => { for (let i = 0; i < 2; i++) { const a = SUB[i], b = SUB[i + 1]; line(g, [[BLK.x + BLK.w / 2 - 20, a.y + a.h + 2], [BLK.x + BLK.w / 2 - 20, b.y - 2]], INK, 3, 10); } });
  add(4, g => line(g, [[RAIL_X + 12, SUB[2].y + SUB[2].h / 2], [1396, SUB[2].y + SUB[2].h / 2], [1396, 232], [1414, 232]], INK, 5, 18));   // MLP output -> clean prediction
  add(4, g => line(g, [[1760, 200], [1760, 122], [LOOP_X, 122], [LOOP_X, GR.y0 - 8]], INDIGO, 3.5, 14));                    // Euler return -> target frames (from above)
  add(4, g => line(g, [[1428, 284], [1428, 344]], INK, 4, 14));                                                               // after 20 steps -> motion
  add(4, g => line(g, [[1428, 488], [1428, 536]], INK, 4, 14));                                                               // rotations -> FK -> skinned
  add(4, g => { line(g, [[RAIL_X, BLK.y + BLK.h + 6], [RAIL_X, SUB[0].y + SUB[0].h / 2]], CLAY, 3.5, 0); for (const sb of SUB) { port(g, RAIL_X, sb.y + sb.h / 2); line(g, [[RAIL_X - 11, sb.y + sb.h / 2], [BLK.x + BLK.w - 32, sb.y + sb.h / 2]], CLAY, 3, 10); } });
  add(4, g => line(g, [[bCap.x + 80, bCap.y + bCap.h + 4], [bCap.x + 80, bLLMb.y - 6]], CLAY, 3.5, 14));                       // caption -> LLM2Vec
  add(4, g => line(g, [[bLLMb.x + bLLMb.w + 4, bLLMb.cy], [bMLPc.x - 6, bLLMb.cy]], CLAY, 3.5, 14));
  add(4, g => line(g, [[bMLPc.x + bMLPc.w + 4, bMLPc.cy], [plusC[0] - 24, plusC[1]]], CLAY, 3.5, 14));
  add(4, g => line(g, [[dialXY[0] + 22, dialXY[1]], [bMLPtime.x - 6, dialXY[1]]], CLAY, 3.5, 14));
  add(4, g => line(g, [[bMLPtime.x + bMLPtime.w + 4, bMLPtime.cy], [plusC[0], bMLPtime.cy], [plusC[0], plusC[1] + 24]], CLAY, 3.5, 14));   // time MLP -> sum (one corner)
  add(4, g => line(g, [[plusC[0], plusC[1] - 22], [RAIL_X, BLK.y + BLK.h + 6]], CLAY, 3.5, 0));                                // sum -> AdaLN rail, straight up
  add(4, g => { plus(g, plusJ[0], plusJ[1], TEAL); plus(g, plusC[0], plusC[1], CLAY); dial(g, dialXY[0], dialXY[1]); });
  // ---- stage 5: labels (about 70 words) ----
  add(5, g => txt(g, '311 rigs · 34–102 joints', 55, 590, S_SUB, { col: GREY }));
  add(5, g => { txt(g, 'rest pose', GR.x0 + 30, 150, S_SUB, { col: TEAL, align: g.CENTER }); txt(g, 'noisy frames', 822, 150, S_SUB, { col: INDIGO, align: g.CENTER }); });
  add(5, g => { txt(g, 'clean', GR.x0 + GR.colW / 2, gridBottom + 48, S_SUB, { col: TEAL, align: g.CENTER }); txt(g, '240 target frames', (tgtLeft + gridRight) / 2, gridBottom + 48, S_SUB, { col: GREY, align: g.CENTER }); txt(g, 'J joints', 540, (GR.y0 + gridBottom) / 2, S_SUB, { col: GREY, align: g.CENTER, rot: -Math.PI / 2 }); });
  for (const sb of SUB) add(5, g => { txt(g, sb.name, BLK.x + 40, sb.y + 40, S_LAB); if (sb.sub) txt(g, sb.sub, BLK.x + 40, sb.y + 74, S_SUB, { col: GREY }); });
  add(5, g => { txt(g, 'tree bias', BLK.x + 206, SUB[1].y + 88 + 62 + 30, 26, { col: INDIGO }); txt(g, '×14', BLK.x + 48, BLK.y + 34, 26, { col: '#fff', bold: true, align: g.CENTER }); txt(g, 'AdaLN', RAIL_X - 14, BLK.y + BLK.h + 40, 28, { col: CLAY, align: g.RIGHT }); });
  add(5, g => { txt(g, '×20 Euler steps', 1428, 158, S_SUB, { col: INDIGO }); txt(g, 'clean prediction', 1444, 300, S_LAB); txt(g, 'after 20 steps', 1444, 338, S_SUB, { col: GREY }); txt(g, 'rotations → FK → skinned', 1444, 522, S_SUB, { col: GREY }); });
  for (const b of [bDesc, bLLMa, bMLPt, bCap, bLLMb, bMLPc, bMLPtime, bUnseen]) add(5, g => drawBoxText(g, b));
  add(5, g => { txt(g, 'caption', bCap.x, bCap.y - 10, S_SUB, { col: CLAY }); txt(g, 'tree', treeXY[0], treeXY[1] + 48, 30, { col: TEAL, align: g.CENTER }); });
  return M;
}
function paint(g, p) {
