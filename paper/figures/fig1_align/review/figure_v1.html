<!doctype html>
<html lang="en">

<title>TopX — Figure 1 (ALIGN method-figure-loop)</title>
<style>
  body { margin: 0; background: #f2f2f2; font: 14px/1.4 "Nimbus Roman", "Times New Roman", Times, serif; color: #222; }
  #host canvas { width: 900px; height: 550px; display: block; margin: 16px auto 8px; background: #fff; box-shadow: 0 0 0 1px #ccc; }
  #controls { width: 900px; margin: 0 auto 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #controls button { font: inherit; padding: 2px 8px; } #controls button.on { background: #1F6F8B; color: #fff; }
  #scrub { flex: 1; } #svg-host, #svg-out { display: none; } body.svgonly > * { display: none; } body.svgonly #svg-out { display: block; }
  #err { color: #b00; white-space: pre-wrap; width: 900px; margin: 0 auto; }

<script>
// p5.js-svg 1.5.1 with p5 1.9.4 wrapper (from ALIGN's example page): p5's transpiled Renderer2D constructor returns a NEW object
// which p5.svg discards; return the object p5 actually built, and give svgcanvas an ellipse() (p5 1.9 draws circle/arc through it).
(function () {
  const OrigSVG = p5.RendererSVG;
  p5.RendererSVG = function (elt, pInst, isMain) {
    const R2D = p5.Renderer2D; let made = null;
    const Tmp = function () { made = R2D.apply(this, arguments); return made; };
    Tmp.prototype = R2D.prototype; p5.Renderer2D = Tmp;
    let shell; try { shell = new OrigSVG(elt, pInst, isMain); } finally { p5.Renderer2D = R2D; }
    Object.setPrototypeOf(made, OrigSVG.prototype);
    made.isSVG = shell.isSVG; made.svg = shell.svg;
    const ctxProto = Object.getPrototypeOf(made.drawingContext);
    if (!ctxProto.ellipse) ctxProto.ellipse = function (x, y, rx, ry, rot, a0, a1, ccw) {
      rot = rot || 0; if (a0 === undefined) { a0 = 0; a1 = Math.PI * 2; }
      const TAU = Math.PI * 2; let span = a1 - a0;
      if (!ccw) { if (span < 0) span += TAU * Math.ceil(-span / TAU); if (span > TAU) span = TAU; }
      else { if (span > 0) span -= TAU * Math.ceil(span / TAU); if (span < -TAU) span = -TAU; }
      const n = Math.max(8, Math.ceil(Math.abs(span) / TAU * 72));
      for (let i = 0; i <= n; i++) { const a = a0 + span * i / n, px = rx * Math.cos(a), py = ry * Math.sin(a);
        const X = x + px * Math.cos(rot) - py * Math.sin(rot), Y = y + px * Math.sin(rot) + py * Math.cos(rot);
        if (i === 0) this.moveTo(X, Y); else this.lineTo(X, Y); }
    };
    return made;
  };
  p5.RendererSVG.prototype = OrigSVG.prototype;
})();
</script>
</head>
<body>
<div id="host"></div>
<div id="controls">
  <button data-stage="1">regions</button><button data-stage="2">token grid</button><button data-stage="3">illustrations</button>
  <button data-stage="4">connections</button><button data-stage="5">labels</button>
  <input type="range" id="scrub" min="0" max="1000" value="1000"><span id="pval">p = 1.000</span><button id="export">export SVG</button>
</div>
<div id="svg-host"></div><div id="svg-out"></div><pre id="err"></pre>
<script>
window.addEventListener('error', e => { document.getElementById('err').textContent += e.message + ' @' + (e.filename||'').split('/').pop() + ':' + e.lineno + '\n'; });
// TopX Figure 1 as a p5 program (ALIGN trial, v1). Every mark is {stage, draw(g)}; every position, route and label is decided
// at build time; draw() only replays. Canvas 1800 x 1000, displayed at 5.5 in (ICLR text width): type floor 32 px = 7 pt.
const W = 1800, H = 1100, NSTAGE = 5;
const FACE = 'Nimbus Roman';   // Times clone present on the render host; the SVG's font-family is rewritten to a Times stack on export
const S_HEAD = 44, S_LAB = 34, S_SUB = 32;
const TEAL = '#1F6F8B', TEAL_BG = '#E4F0F4', TEAL_CELL = '#5F9BB0', CLAY = '#B5552F', CLAY_BG = '#F8E9E1', INK = '#2B2B2B', GREY = '#6E6E6E', CELL = '#D4D4D4', PANEL_BG = '#F4F4F4';
const T = {}; let MARKS = null, P = 1, main = null, svgInst = null;

// ---------- primitives (all pure: they draw from their arguments only) ----------
function txt(g, s, x, y, size, opts) {
  opts = opts || {}; g.push(); g.noStroke(); g.fill(opts.col || INK); g.textFont(FACE); g.textSize(size);
  g.textStyle(opts.bold ? g.BOLD : (opts.italic ? g.ITALIC : g.NORMAL)); g.textAlign(opts.align || g.LEFT, opts.valign || g.BASELINE);
  if (opts.rot) { g.translate(x, y); g.rotate(opts.rot); g.text(s, 0, 0); } else g.text(s, x, y); g.pop();
}
function panel(g, x, y, w, h, opts) {
  opts = opts || {}; g.push(); g.stroke(opts.stroke || INK); g.strokeWeight(opts.sw || 3); g.fill(opts.fill || '#fff'); g.rect(x, y, w, h, opts.r === undefined ? 10 : opts.r);
  if (opts.double) { g.noFill(); g.strokeWeight(1.5); g.rect(x + 7, y + 7, w - 14, h - 14, 6); } g.pop();
}
function cell(g, x, y, w, h, col) { g.push(); g.noStroke(); g.fill(col); g.rect(x, y, w, h, 2); g.pop(); }
function line(g, pts, col, sw, head) {
  g.push(); g.stroke(col); g.strokeWeight(sw); g.noFill(); g.strokeJoin(g.ROUND); g.strokeCap(g.ROUND);
  g.beginShape(); for (const p of pts) g.vertex(p[0], p[1]); g.endShape(); g.pop();
  if (head) { const a = pts[pts.length - 2], b = pts[pts.length - 1], ang = Math.atan2(b[1] - a[1], b[0] - a[0]), L = head;
    g.push(); g.noStroke(); g.fill(col); g.translate(b[0], b[1]); g.rotate(ang); g.triangle(0, 0, -L, -L * 0.42, -L, L * 0.42); g.pop(); }
}
function img(g, name, x, y, w) { const im = T[name]; if (!im) return; const h = w * im.height / im.width; g.image(im, x, y, w, h); return h; }
function imgH(name, w) { const im = T[name]; return im ? w * im.height / im.width : 0; }
function plus(g, x, y, col) { g.push(); g.stroke(col); g.strokeWeight(3); g.fill('#fff'); g.circle(x, y, 40); g.strokeWeight(3.5); g.line(x - 11, y, x + 11, y); g.line(x, y - 11, x, y + 11); g.pop(); }
function port(g, x, y) { g.push(); g.stroke(CLAY); g.strokeWeight(3); g.fill(CLAY_BG); g.rect(x - 11, y - 11, 22, 22, 3); g.pop(); }
function miniGrid(g, x, y, mode) {
  const cw = 22, ch = 18, gap = 5;
  for (let c = 0; c < 6; c++) for (let r = 0; r < 4; r++) { const hi = mode === 'row' ? r === 2 : c === 2; cell(g, x + c * (cw + gap), y + r * (ch + gap), cw, ch, hi ? TEAL_CELL : CELL); }
  g.push(); g.stroke(TEAL); g.strokeWeight(3);
  if (mode === 'row') g.line(x, y + 2 * (ch + gap) + ch / 2, x + 6 * (cw + gap) - gap, y + 2 * (ch + gap) + ch / 2);
  else g.line(x + 2 * (cw + gap) + cw / 2, y, x + 2 * (cw + gap) + cw / 2, y + 4 * (ch + gap) - gap);
  g.pop();
}

// ---------- layout (build time) ----------
const L = {
  heads: [[40, 70, '1', 'Any rig'], [520, 70, '2', 'Skeleton as context'], [1060, 70, '3', 'Transformer'], [1420, 70, '4', 'Sample & decode']],
  restTags: { x: 60, y: 112, w: 360 }, rig2: { x: 40, y: 430, w: 200 }, rig3: { x: 262, y: 430, w: 200 },
  grid: { x0: 540, y0: 300, colW: 60, gap: 10, rowH: 27, rowGap: 6, rows: 8, cols: 6 },
  restGlyph: { x: 532, y: 165, w: 78 }, noisy: [{ x: 625, y: 175, w: 60 }, { x: 695, y: 175, w: 60 }, { x: 765, y: 175, w: 60 }, { x: 835, y: 175, w: 60 }],
  blk: { x: 1060, y: 110, w: 320, h: 500 }, sub: [{ y: 140, h: 172, name: 'temporal attention', sub: 'a joint over frames', icon: 'row' }, { y: 330, h: 196, name: 'spatial attention', sub: 'a frame over joints', icon: 'col' }, { y: 544, h: 52, name: 'MLP', sub: '', icon: null }],
  rail: { x: 1075 },
  clean: [{ x: 1420, y: 142, w: 82 }, { x: 1508, y: 142, w: 82 }, { x: 1596, y: 142, w: 82 }, { x: 1684, y: 142, w: 82 }],
  strip: { x: 1420, y: 330, w: 360 }, skin: { x: 1420, y: 530, w: 170 }, unseen: { x: 1420, y: 790, w: 360, h: 100 },
  desc: { x: 40, y: 760, w: 380, h: 70 }, cap: { x: 40, y: 850, w: 380, h: 112 }, llm: { x: 460, y: 770, w: 160, h: 170 },
  lin: { x: 660, y: 760, w: 200, h: 56 }, smlp: { x: 660, y: 832, w: 200, h: 56 }, cmlp: { x: 660, y: 904, w: 200, h: 56 }, tmlp: { x: 660, y: 976, w: 200, h: 56 },
  plusJ: [920, 788], plusC: [920, 1004], tdial: [560, 1004],
};
const G = L.grid; const gridRight = G.x0 + G.cols * G.colW + (G.cols - 1) * G.gap, gridBottom = G.y0 + G.rows * G.rowH + (G.rows - 1) * G.rowGap;
const rowY = r => G.y0 + r * (G.rowH + G.rowGap); const HIGHLIGHT_ROW = 5;

function buildMarks() {
  const M = []; const add = (stage, draw) => M.push({ stage, draw });
  // ---- stage 1: regions and panels ----
  for (const [x, y, n, s] of L.heads) add(1, g => { g.push(); g.noStroke(); g.fill(TEAL); g.circle(x + 20, y - 15, 40); g.pop(); txt(g, n, x + 20, y - 3, 30, { col: '#fff', bold: true, align: g.CENTER }); txt(g, s, x + 50, y, S_HEAD, { bold: true }); });
  add(1, g => { panel(g, L.blk.x + 12, L.blk.y + 12, L.blk.w, L.blk.h, { fill: PANEL_BG, stroke: '#CFCFCF', sw: 2 }); panel(g, L.blk.x, L.blk.y, L.blk.w, L.blk.h, {}); });
  for (const s of L.sub) add(1, g => panel(g, L.blk.x + 26, s.y, L.blk.w - 52, s.h, { fill: s.icon === 'col' ? TEAL_BG : '#fff', stroke: s.icon === 'col' ? TEAL : INK, sw: 2.5, r: 8 }));
  add(1, g => panel(g, L.desc.x, L.desc.y, L.desc.w, L.desc.h, { fill: TEAL_BG, stroke: TEAL, sw: 2.5 }));
  add(1, g => panel(g, L.cap.x, L.cap.y, L.cap.w, L.cap.h, { fill: CLAY_BG, stroke: CLAY, sw: 2.5 }));
  add(1, g => panel(g, L.llm.x, L.llm.y, L.llm.w, L.llm.h, { stroke: GREY, sw: 2, double: true }));
  for (const b of [L.lin, L.smlp, L.cmlp, L.tmlp]) add(1, g => panel(g, b.x, b.y, b.w, b.h, { sw: 2.5, r: 8 }));
  add(1, g => panel(g, L.unseen.x, L.unseen.y, L.unseen.w, L.unseen.h, { stroke: TEAL, sw: 2.5 }));
  // ---- stage 2: the token grid ----
  for (let c = 0; c < G.cols; c++) for (let r = 0; r < G.rows; r++) add(2, g => cell(g, G.x0 + c * (G.colW + G.gap), rowY(r), G.colW, G.rowH, c === 0 ? TEAL_CELL : CELL));
  add(2, g => { g.push(); g.noFill(); g.stroke(TEAL); g.strokeWeight(3.5); g.rect(G.x0 - 8, rowY(HIGHLIGHT_ROW) - 5, gridRight - G.x0 + 16, G.rowH + 10, 4); g.pop(); });
  add(2, g => { g.push(); g.noStroke(); g.fill('rgba(31,111,139,0.30)'); const rg = L.restGlyph, hh = imgH('rest', rg.w); g.quad(rg.x + 8, rg.y + hh + 4, rg.x + rg.w - 8, rg.y + hh + 4, G.x0 + G.colW, G.y0 - 4, G.x0, G.y0 - 4); g.pop(); });
  // ---- stage 3: illustrations (real crops) ----
  add(3, g => img(g, 'rest_tags', L.restTags.x, L.restTags.y, L.restTags.w));
  add(3, g => img(g, 'rest_gharial', L.rig2.x, L.rig2.y, L.rig2.w)); add(3, g => img(g, 'rest_lemur', L.rig3.x, L.rig3.y, L.rig3.w));
  add(3, g => img(g, 'rest', L.restGlyph.x, L.restGlyph.y, L.restGlyph.w));
  L.noisy.forEach((n, k) => add(3, g => img(g, 'noisy_' + k, n.x, n.y, n.w)));
  add(3, g => txt(g, '…', 915, 230, S_SUB, { col: GREY }));
  L.sub.forEach(s => { if (s.icon) add(3, g => miniGrid(g, L.blk.x + 42, s.y + 90, s.icon)); });
  add(3, g => img(g, 'bias', L.blk.x + 42 + 162 + 16, L.sub[1].y + 90, 70));
  L.clean.forEach((c, k) => add(3, g => img(g, 'clean_' + k, c.x, c.y, c.w)));
  add(3, g => img(g, 'motion_strip', L.strip.x, L.strip.y, L.strip.w));
  add(3, g => img(g, 'skinned_moose', L.skin.x, L.skin.y, L.skin.w));
  // ---- stage 4: connections (edge to edge, decided here) ----
  add(4, g => line(g, [[L.restTags.x + L.restTags.w + 12, 330], [G.x0 - 6, 330]], TEAL, 3.5, 14));
  add(4, g => line(g, [[L.rig2.x + L.rig2.w + 4, 500], [500, 500], [500, 400], [G.x0 - 6, 400]], TEAL, 3.5, 14));
  add(4, g => line(g, [[L.rig3.x + L.rig3.w + 4, 500], [500, 500]], TEAL, 3.5, 0));
  add(4, g => line(g, [[gridRight + 8, 430], [L.blk.x - 6, 430]], INK, 5, 18));
  add(4, g => line(g, [[L.blk.x + L.blk.w + 8, 184], [L.clean[0].x - 6, 184]], INK, 5, 18));
  add(4, g => line(g, [[1766, 138], [1766, 96], [1020, 96], [1020, 335], [gridRight + 6, 335]], INK, 3, 14));
  add(4, g => { line(g, [[L.rail.x, 640], [L.rail.x, L.sub[0].y + L.sub[0].h / 2]], CLAY, 3.5, 0); for (const s of L.sub) { port(g, L.rail.x, s.y + s.h / 2); line(g, [[L.rail.x + 11, s.y + s.h / 2], [L.blk.x + 22, s.y + s.h / 2]], CLAY, 3, 10); } });
  add(4, g => line(g, [[L.desc.x + L.desc.w + 4, 795], [L.llm.x - 6, 795]], TEAL, 3.5, 14));
  add(4, g => line(g, [[L.llm.x + L.llm.w + 4, 788], [L.lin.x - 6, 788]], TEAL, 3.5, 14));
  add(4, g => line(g, [[L.lin.x + L.lin.w + 4, 788], [L.plusJ[0] - 24, 788]], TEAL, 3.5, 14));
  add(4, g => line(g, [[L.smlp.x + L.smlp.w + 4, 860], [L.plusJ[0], 860], [L.plusJ[0], L.plusJ[1] + 24]], TEAL, 3.5, 14));
  add(4, g => line(g, [[L.plusJ[0], L.plusJ[1] - 22], [L.plusJ[0], 700], [1010, 700], [1010, rowY(HIGHLIGHT_ROW) + G.rowH / 2], [gridRight + 12, rowY(HIGHLIGHT_ROW) + G.rowH / 2]], TEAL, 3.5, 14));
  add(4, g => line(g, [[L.cap.x + L.cap.w + 4, 906], [440, 906], [440, 920], [L.llm.x - 6, 920]], CLAY, 3.5, 14));
  add(4, g => line(g, [[L.llm.x + L.llm.w + 4, 920], [640, 920], [640, 932], [L.cmlp.x - 6, 932]], CLAY, 3.5, 14));
  add(4, g => { g.push(); g.stroke(CLAY); g.strokeWeight(3); g.fill(CLAY_BG); g.circle(L.tdial[0], L.tdial[1], 30); g.pop(); line(g, [[L.tdial[0] + 17, L.tdial[1]], [L.tmlp.x - 6, L.tdial[1]]], CLAY, 3.5, 14); });
  add(4, g => line(g, [[L.cmlp.x + L.cmlp.w + 4, 932], [L.plusC[0], 932], [L.plusC[0], L.plusC[1] - 24]], CLAY, 3.5, 14));
  add(4, g => line(g, [[L.tmlp.x + L.tmlp.w + 4, 1004], [L.plusC[0] - 24, 1004]], CLAY, 3.5, 14));
  add(4, g => line(g, [[L.plusC[0] + 22, L.plusC[1]], [1040, L.plusC[1]], [1040, 640], [L.rail.x, 640]], CLAY, 3.5, 0));
  add(4, g => { plus(g, L.plusJ[0], L.plusJ[1], TEAL); plus(g, L.plusC[0], L.plusC[1], CLAY); });
  // ---- stage 5: labels (about 75 words) ----
  add(5, g => txt(g, '311 rigs · 34–102 joints', 40, 620, S_SUB, { col: GREY }));
  add(5, g => { txt(g, 'rest frame', L.restGlyph.x + 39, 150, S_SUB, { col: TEAL, align: g.CENTER }); txt(g, 'noise-mixed target frames', 815, 150, S_SUB, { col: GREY, align: g.CENTER }); });
  add(5, g => { txt(g, 'J joints', G.x0 - 22, (G.y0 + gridBottom) / 2, S_SUB, { col: GREY, align: g.CENTER, rot: -Math.PI / 2 }); txt(g, '240 target frames × J joints', 800, gridBottom + 42, S_SUB, { col: GREY, align: g.CENTER }); txt(g, '17 channels per token', 800, gridBottom + 78, S_SUB, { col: GREY, align: g.CENTER }); });
  for (const s of L.sub) add(5, g => { txt(g, s.name, L.blk.x + 40, s.y + 40, S_LAB); if (s.sub) txt(g, s.sub, L.blk.x + 40, s.y + 74, S_SUB, { col: GREY }); });
  add(5, g => { txt(g, 'tree bias', L.blk.x + 42 + 162 + 16, L.sub[1].y + 90 + 70 + 26, 26, { col: TEAL }); txt(g, '×14', L.blk.x + L.blk.w - 30, L.blk.y + 30, 30, { col: GREY, align: g.RIGHT }); });
  add(5, g => txt(g, 'AdaLN', L.rail.x + 14, 668, S_SUB, { col: CLAY }));
  add(5, g => { txt(g, 'predicted clean motion', 1420, 270, S_LAB); txt(g, '×20 Euler steps, s = 2', 1440, 126, S_SUB, { col: GREY }); });
  add(5, g => { txt(g, 'motion of this rig', 1420, 500, S_SUB, { col: GREY }); txt(g, 'rotations → FK → skinned', 1420, 748, S_SUB, { col: GREY }); });
  add(5, g => { txt(g, 'unseen rig: same pass;', L.unseen.x + 16, L.unseen.y + 40, S_SUB); txt(g, '~10 clips → LoRA', L.unseen.x + 16, L.unseen.y + 78, S_SUB); });
  add(5, g => { txt(g, 'joint descriptions', L.desc.x + 16, L.desc.y + 46, S_LAB, { col: TEAL }); txt(g, 'caption:', L.cap.x + 16, L.cap.y + 36, S_SUB, { col: CLAY }); txt(g, '“the moose runs and then', L.cap.x + 16, L.cap.y + 70, S_SUB, { col: CLAY }); txt(g, 'slows to a walk”', L.cap.x + 16, L.cap.y + 104, S_SUB, { col: CLAY }); });
  add(5, g => { txt(g, 'LLM2Vec', L.llm.x + L.llm.w / 2, L.llm.y + 78, S_LAB, { align: g.CENTER }); txt(g, 'frozen', L.llm.x + L.llm.w / 2, L.llm.y + 112, S_SUB, { col: GREY, align: g.CENTER }); });
  add(5, g => { txt(g, 'linear', L.lin.x + L.lin.w / 2, L.lin.y + 39, S_SUB, { align: g.CENTER }); txt(g, 'structure MLP', L.smlp.x + L.smlp.w / 2, L.smlp.y + 39, S_SUB, { align: g.CENTER }); txt(g, 'MLP', L.cmlp.x + L.cmlp.w / 2, L.cmlp.y + 39, S_SUB, { align: g.CENTER }); txt(g, 'MLP', L.tmlp.x + L.tmlp.w / 2, L.tmlp.y + 39, S_SUB, { align: g.CENTER }); txt(g, 'flow time t', L.tdial[0] - 24, L.tdial[1] + 11, S_SUB, { align: g.RIGHT }); });
  add(5, g => { txt(g, 'added to every token of joint j', 1000, 688, S_SUB, { col: TEAL, align: g.RIGHT }); txt(g, 'c: modulation only', 1060, 1075, S_SUB, { col: CLAY }); });
  return M;
}
function paint(g, p) {
  g.push(); g.background(255); g.pop();
  const eps = 1e-6;
  for (let k = 1; k <= NSTAGE; k++) {
    let f = p * NSTAGE - (k - 1); f = f > 1 - eps ? 1 : f < eps ? 0 : f;
    if (f <= 0) break;
    const ms = MARKS.filter(m => m.stage === k); const n = Math.floor(f * ms.length + eps);
    for (let i = 0; i < n; i++) ms[i].draw(g);
  }
}
function parseHash() { const out = {}; for (const kv of location.hash.replace(/^#/, '').split('&')) { if (!kv) continue; const [k, v] = kv.split('='); out[k] = v === undefined ? true : decodeURIComponent(v); } return out; }
function setP(p, fromSlider) {
  P = Math.min(1, Math.max(0, p)); if (!fromSlider) document.getElementById('scrub').value = Math.round(P * 1000);
  document.getElementById('pval').textContent = 'p = ' + P.toFixed(3);
  document.querySelectorAll('#controls [data-stage]').forEach(b => b.classList.toggle('on', Math.abs(P - (+b.dataset.stage) / NSTAGE) < 1e-6));
  if (main) main.redraw();
}
function applyHash() { const q = parseHash(); if (q.stage) setP((+q.stage) / NSTAGE); else if (q.p !== undefined && q.p !== true) setP(+q.p); if (q.svg !== undefined) { document.body.classList.add('svgonly'); buildSVGSafe(false); } }
function buildSVG(download) {
  const host = document.getElementById('svg-host'); host.innerHTML = '';
  svgInst = new p5(s => {
    s.preload = () => { for (const k in (window.THUMBS || {})) T[k] = s.loadImage(THUMBS[k]); };
    s.setup = () => { s.createCanvas(W, H, s.SVG).parent(host); s.noLoop(); s.pixelDensity(1); paint(s, 1);
      const el = host.querySelector('svg');
      if (el) { el.setAttribute('viewBox', '0 0 ' + W + ' ' + H); el.setAttribute('width', W); el.setAttribute('height', H);
        const out = document.getElementById('svg-out'); out.innerHTML = ''; out.appendChild(el.cloneNode(true)); }
      if (download) s.save('topx-figure1.svg'); };
    s.draw = () => {};

}
