<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TopX — Figure 1 (ALIGN method-figure-loop)</title>
<style>
  body { margin: 0; background: #f2f2f2; font: 14px/1.4 "Nimbus Roman", "Times New Roman", Times, serif; color: #222; }
  #host canvas { width: 900px; height: 500px; display: block; margin: 16px auto 8px; background: #fff; box-shadow: 0 0 0 1px #ccc; }
  #controls { width: 900px; margin: 0 auto 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #controls button { font: inherit; padding: 2px 8px; } #controls button.on { background: #1F6F8B; color: #fff; }
  #scrub { flex: 1; } #svg-host, #svg-out { display: none; } body.svgonly > * { display: none; } body.svgonly #svg-out { display: block; }
  #err { color: #b00; white-space: pre-wrap; width: 900px; margin: 0 auto; }
</style>
<script src="vendor/p5.min.js"></script>
<script src="vendor/p5.svg.js"></script>
<script src="thumbs.js"></script>
<script>
// p5.js-svg 1.5.1 with p5 1.9.4 wrapper (from ALIGN's example page): p5's transpiled Renderer2D constructor returns a NEW object
// which p5.svg discards; return the object p5 actually built, and give svgcanvas an ellipse() (p5 1.9 draws circle/arc through it).
(function () {
  const OrigSVG = p5.RendererSVG;
  p5.RendererSVG = function (elt, pInst, isMain) {
    const R2D = p5.Renderer2D; let made = null;
    const Tmp = function () { made = R2D.apply(this, arguments); return made; };
    Tmp.prototype = R2D.prototype; p5.Renderer2D = Tmp;
    let shell; try { shell = new OrigSVG(elt, pInst, isMain); } finally { p5.Renderer2D = R2D; }
    Object.setPrototypeOf(made, OrigSVG.prototype);
    made.isSVG = shell.isSVG; made.svg = shell.svg;
    const ctxProto = Object.getPrototypeOf(made.drawingContext);
    if (!ctxProto.ellipse) ctxProto.ellipse = function (x, y, rx, ry, rot, a0, a1, ccw) {
      rot = rot || 0; if (a0 === undefined) { a0 = 0; a1 = Math.PI * 2; }
      const TAU = Math.PI * 2; let span = a1 - a0;
      if (!ccw) { if (span < 0) span += TAU * Math.ceil(-span / TAU); if (span > TAU) span = TAU; }
      else { if (span > 0) span -= TAU * Math.ceil(span / TAU); if (span < -TAU) span = -TAU; }
      const n = Math.max(8, Math.ceil(Math.abs(span) / TAU * 72));
      for (let i = 0; i <= n; i++) { const a = a0 + span * i / n, px = rx * Math.cos(a), py = ry * Math.sin(a);
        const X = x + px * Math.cos(rot) - py * Math.sin(rot), Y = y + px * Math.sin(rot) + py * Math.cos(rot);
        if (i === 0) this.moveTo(X, Y); else this.lineTo(X, Y); }
    };
    return made;
  };
  p5.RendererSVG.prototype = OrigSVG.prototype;
})();
</script>
</head>
<body>
<div id="host"></div>
<div id="controls">
  <button data-stage="1">regions</button><button data-stage="2">token grid</button><button data-stage="3">illustrations &amp; callouts</button>
  <button data-stage="4">connections</button><button data-stage="5">labels</button>
  <input type="range" id="scrub" min="0" max="1000" value="1000"><span id="pval">p = 1.000</span><button id="export">export SVG</button>
</div>
<div id="svg-host"></div><div id="svg-out"></div><pre id="err"></pre>
<script>
window.addEventListener('error', e => { document.getElementById('err').textContent += e.message + ' @' + (e.filename||'').split('/').pop() + ':' + e.lineno + '\n'; });
// TopX Figure 1 as a p5 program (ALIGN trial, v6 = redesign: tinted stage bands, three accents, bold glyphs, straight lanes,
// boxes sized to their text, icons for frozen / tree / time). Every mark is {stage, draw(g)}; all geometry is decided at build time.
const W = 1800, H = 1000, NSTAGE = 5;
const FACE = 'Nimbus Roman';
const S_HEAD = 40, S_LAB = 34, S_SUB = 32;
const TEAL = '#1F7F93', TEAL_D = '#0E4F5E', TEAL_BG = '#D7ECF0', INDIGO = '#5B5FA8', INDIGO_L = '#C9CAE6', INDIGO_BG = '#EBEBF6',
      CLAY = '#B5552F', CLAY_BG = '#F8E5DA', INK = '#2B2B2B', GREY = '#6E6E6E', CELL = '#DADADA';
const BAND = ['#F7F2EA', '#EDF4F6', '#F0EFF8', '#FAF1EB'];          // one very light tint per stage: sand, mist, lavender, clay
const T = {}; let MARKS = null, P = 1, main = null, svgInst = null;

// ---------- primitives ----------
function txt(g, s, x, y, size, opts) {
  opts = opts || {}; g.push(); g.noStroke(); g.fill(opts.col || INK); g.textFont(FACE); g.textSize(size);
  g.textStyle(opts.bold ? g.BOLD : (opts.italic ? g.ITALIC : g.NORMAL)); g.textAlign(opts.align || g.LEFT, opts.valign || g.BASELINE);
  if (opts.rot) { g.translate(x, y); g.rotate(opts.rot); g.text(s, 0, 0); } else g.text(s, x, y); g.pop();
}
function measure(s, str, size, bold) { s.push(); s.textFont(FACE); s.textSize(size); s.textStyle(bold ? s.BOLD : s.NORMAL); const w = s.textWidth(str); s.pop(); return w; }
function rrect(g, x, y, w, h, opts) { opts = opts || {}; g.push(); if (opts.stroke) { g.stroke(opts.stroke); g.strokeWeight(opts.sw || 3); } else g.noStroke(); g.fill(opts.fill || '#fff'); g.rect(x, y, w, h, opts.r === undefined ? 10 : opts.r); g.pop(); }
function cell(g, x, y, w, h, col) { g.push(); g.noStroke(); g.fill(col); g.rect(x, y, w, h, 3); g.pop(); }
function line(g, pts, col, sw, head) {
  g.push(); g.stroke(col); g.strokeWeight(sw); g.noFill(); g.strokeJoin(g.ROUND); g.strokeCap(g.ROUND);
  g.beginShape(); for (const p of pts) g.vertex(p[0], p[1]); g.endShape(); g.pop();
  if (head) { const a = pts[pts.length - 2], b = pts[pts.length - 1], ang = Math.atan2(b[1] - a[1], b[0] - a[0]), L = head;
    g.push(); g.noStroke(); g.fill(col); g.translate(b[0], b[1]); g.rotate(ang); g.triangle(0, 0, -L, -L * 0.42, -L, L * 0.42); g.pop(); }
}
function img(g, name, x, y, w) { const im = T[name]; if (!im) return 0; const h = w * im.height / im.width; g.image(im, x, y, w, h); return h; }
function imgH(name, w) { const im = T[name]; return im ? w * im.height / im.width : 0; }
function plus(g, x, y, col) { g.push(); g.stroke(col); g.strokeWeight(3); g.fill('#fff'); g.circle(x, y, 40); g.strokeWeight(3.5); g.line(x - 11, y, x + 11, y); g.line(x, y - 11, x, y + 11); g.pop(); }
function port(g, x, y) { g.push(); g.stroke(CLAY); g.strokeWeight(3); g.fill(CLAY_BG); g.rect(x - 11, y - 11, 22, 22, 3); g.pop(); }
function lock(g, x, y, k) {   // a small padlock: shackle + body; k = scale
  g.push(); g.noFill(); g.stroke(GREY); g.strokeWeight(2.5 * k); g.arc(x, y - 9 * k, 16 * k, 18 * k, Math.PI, 2 * Math.PI); g.fill(GREY); g.noStroke(); g.rect(x - 11 * k, y - 4 * k, 22 * k, 18 * k, 3 * k); g.pop();
}
function treeIcon(g, x, y, col) {   // a small kinematic tree: root, two children, four leaves
  g.push(); g.stroke(col); g.strokeWeight(3); const p = [[x, y - 26], [x - 16, y - 4], [x + 16, y - 4], [x - 24, y + 20], [x - 8, y + 20], [x + 8, y + 20], [x + 24, y + 20]];
  const e = [[0, 1], [0, 2], [1, 3], [1, 4], [2, 5], [2, 6]]; for (const [a, b] of e) g.line(p[a][0], p[a][1], p[b][0], p[b][1]);
  g.noStroke(); g.fill(col); for (const q of p) g.circle(q[0], q[1], 9); g.pop();
}
function dial(g, x, y) { g.push(); g.stroke(CLAY); g.strokeWeight(3); g.fill(CLAY_BG); g.circle(x, y, 40); g.line(x, y, x + 10, y - 12); g.pop(); txt(g, 't', x - 4, y + 24, 30, { col: CLAY, italic: true, align: g.CENTER }); }
function miniGrid(g, x, y, mode, hi) {   // 6 x 3 cells; a row (a joint over frames) or a column (a frame over joints) highlighted
  const cw = 22, ch = 18, gap = 5;
  for (let c = 0; c < 6; c++) for (let r = 0; r < 3; r++) { const on = mode === 'row' ? r === 1 : c === 2; cell(g, x + c * (cw + gap), y + r * (ch + gap), cw, ch, on ? hi : CELL); }
  g.push(); g.stroke(hi); g.strokeWeight(3);
  if (mode === 'row') g.line(x, y + (ch + gap) + ch / 2, x + 6 * (cw + gap) - gap, y + (ch + gap) + ch / 2);
  else g.line(x + 2 * (cw + gap) + cw / 2, y, x + 2 * (cw + gap) + cw / 2, y + 3 * (ch + gap) - gap);
  g.pop();
}
// a box sized to its label: returns {x,y,w,h,cx,cy}; label(s) drawn by the labels stage via box.draw
function makeBox(s, x, y, lines, opts) {
  opts = opts || {}; const size = opts.size || S_SUB, pad = opts.pad === undefined ? 16 : opts.pad, lh = size * 1.12;
  const tw = Math.max(...lines.map(l => measure(s, l, size, opts.bold))) + (opts.icon ? 40 : 0);
  const w = Math.max(opts.minW || 0, tw + 2 * pad), h = lines.length * lh + 2 * pad - size * 0.2;
  return { x, y, w, h, cx: x + w / 2, cy: y + h / 2, lines, size, opts };
}
function drawBoxFrame(g, b) { rrect(g, b.x, b.y, b.w, b.h, { stroke: b.opts.stroke || INK, sw: b.opts.sw || 2.5, fill: b.opts.fill || '#fff', r: 9 }); }
function drawBoxText(g, b) {
  const size = b.size, lh = size * 1.12, n = b.lines.length, x0 = b.cx - (b.opts.icon ? 20 : 0);
  b.lines.forEach((l, i) => txt(g, l, x0, b.cy + (i - (n - 1) / 2) * lh + size * 0.36, size, { col: b.opts.col || INK, align: g.CENTER }));
  if (b.opts.icon === 'lock') lock(g, b.x + b.w - 30, b.cy, 1.0);
}

// ---------- layout (v7: the architecture itself — token channels, sequence, every addend of a token, conditioning, block, head) ----------
const BANDS = [{ x: 30, w: 430, title: 'Any rig → tokens' }, { x: 480, w: 440, title: 'Token embedding' }, { x: 940, w: 430, title: 'Transformer' }, { x: 1390, w: 380, title: 'Sample & decode' }];
const CH = [{ n: 3, col: '#2A9D8F', lab: 'position' }, { n: 6, col: '#1F7F93', lab: 'rotation Δ' }, { n: 3, col: '#8FB3C9', lab: 'velocity' }, { n: 1, col: '#D9A441', lab: 'contact' }, { n: 4, col: '#5B5FA8', lab: 'root' }];
const STRIP = { x: 50, y: 522, w: 380, h: 30 };
const SEQ = { x0: 50, y0: 668, colW: 48, gap: 6, rowH: 18, rowGap: 4, rows: 6, cols: 7 };
const seqRight = SEQ.x0 + SEQ.cols * SEQ.colW + (SEQ.cols - 1) * SEQ.gap, seqBottom = SEQ.y0 + SEQ.rows * SEQ.rowH + (SEQ.rows - 1) * SEQ.rowGap;
const TOK = { x: 838, y: 150, w: 62, h: 540 };                               // the D-dim token, receiving its addends from the left
const BLK = { x: 990, y: 130, w: 360, h: 590 }; const RAIL_X = 962;
const SUB = [{ y: 165, h: 172, name: 'temporal attention', sub: 'a joint over frames', icon: 'row' }, { y: 355, h: 200, name: 'spatial attention', sub: 'a frame over joints', icon: 'col' }, { y: 573, h: 46, name: 'MLP', sub: '', icon: null }];
const HEAD = { y: 640 };

function channelStrip(g, s) {   // one joint's 17 channels as a coloured strip, segment width proportional to the channel count
  let x = s.x; const total = CH.reduce((a, c) => a + c.n, 0);
  for (const c of CH) { const w = s.w * c.n / total; g.push(); g.noStroke(); g.fill(c.col); g.rect(x, s.y, w - 3, s.h, 4); g.pop(); x += w; }
}

function buildMarks(s) {
  const M = []; const add = (stage, draw) => M.push({ stage, draw });
  // ---- boxes sized to their text ----
  const inlets = [];   // [y, label] addends entering the token
  const bLin = makeBox(s, 500, 168, ['linear 17 → D'], { stroke: INK, pad: 12 }); bLin.h = 52; bLin.cy = bLin.y + 26;
  const bPos = makeBox(s, 500, 236, ['frame position'], { stroke: GREY, sw: 2, pad: 12, col: GREY }); bPos.h = 52; bPos.cy = bPos.y + 26;
  const bSlot = makeBox(s, 500, 304, ['joint slot'], { stroke: GREY, sw: 2, pad: 12, col: GREY }); bSlot.h = 52; bSlot.cy = bSlot.y + 26;
  const bMask = makeBox(s, 500, 372, ['mask: target frame'], { stroke: INDIGO, fill: INDIGO_BG, pad: 12, col: INDIGO }); bMask.h = 52; bMask.cy = bMask.y + 26;
  const bDesc = makeBox(s, 500, 470, ['“the left front foot”'], { stroke: TEAL, fill: TEAL_BG, col: TEAL_D, pad: 12 }); bDesc.h = 52; bDesc.cy = bDesc.y + 26;
  const bLLMa = makeBox(s, 500, 538, ['LLM2Vec → linear'], { icon: 'lock', stroke: GREY, sw: 2, pad: 12 }); bLLMa.h = 56; bLLMa.cy = bLLMa.y + 28;
  const bTree = makeBox(s, 560, 618, ['MLP (8-d)'], { stroke: INK, pad: 12 }); bTree.h = 52; bTree.cy = bTree.y + 26; const treeXY = [520, bTree.cy];
  const bCap = makeBox(s, 500, 722, ['“the moose runs and', 'then slows to a walk”'], { stroke: CLAY, fill: CLAY_BG, col: CLAY, pad: 12 });
  const bLLMb = makeBox(s, 500, 828, ['LLM2Vec → MLP'], { icon: 'lock', stroke: GREY, sw: 2, pad: 12 }); bLLMb.h = 56; bLLMb.cy = bLLMb.y + 28;
  const bMLPt = makeBox(s, 560, 898, ['MLP'], { minW: 80, pad: 10 }); bMLPt.h = 52; bMLPt.cy = bMLPt.y + 26; const dialXY = [520, bMLPt.cy];
  const plusC = [845, (bLLMb.cy + bMLPt.cy) / 2];
  const bHead = makeBox(s, BLK.x + 60, HEAD.y, ['LN · linear D → 17'], { stroke: INK, pad: 12 }); bHead.h = 52; bHead.cy = bHead.y + 26;
  const bUnseen = makeBox(s, 1404, 830, ['unseen rig: same pass;', 'optional LoRA, ~10 clips'], { stroke: TEAL, sw: 2.5, col: INK, pad: 14 });
  // ---- stage 1: bands, titles, panels ----
  BANDS.forEach((b, i) => add(1, g => rrect(g, b.x, 40, b.w, 930, { fill: BAND[i], r: 18 })));
  BANDS.forEach((b, i) => add(1, g => { g.push(); g.noStroke(); g.fill([TEAL, TEAL, INDIGO, CLAY][i]); g.circle(b.x + 36, 82, 34); g.pop(); txt(g, String(i + 1), b.x + 36, 93, 26, { col: '#fff', bold: true, align: g.CENTER }); txt(g, b.title, b.x + 62, 96, S_HEAD, { bold: true }); }));
  add(1, g => { rrect(g, BLK.x + 10, BLK.y + 10, BLK.w, BLK.h, { fill: '#E4E3EF', r: 12 }); rrect(g, BLK.x, BLK.y, BLK.w, BLK.h, { stroke: INK, sw: 3, fill: '#fff', r: 12 }); });
  for (const sb of SUB) add(1, g => rrect(g, BLK.x + 30, sb.y, BLK.w - 60, sb.h, { stroke: sb.icon === 'col' ? INDIGO : INK, sw: 2.5, fill: sb.icon === 'col' ? INDIGO_BG : '#fff', r: 8 }));
  add(1, g => rrect(g, TOK.x, TOK.y, TOK.w, TOK.h, { stroke: INK, sw: 3, fill: '#fff', r: 14 }));
  for (const b of [bLin, bPos, bSlot, bMask, bDesc, bLLMa, bTree, bCap, bLLMb, bMLPt, bHead, bUnseen]) add(1, g => drawBoxFrame(g, b));
  add(1, g => rrect(g, BLK.x + 16, BLK.y + 12, 64, 30, { fill: INK, r: 15 }));
  // ---- stage 2: representation — channel strip and the sequence ----
  add(2, g => channelStrip(g, STRIP));
  for (let c = 0; c < SEQ.cols; c++) for (let r = 0; r < SEQ.rows; r++) add(2, g => cell(g, SEQ.x0 + c * (SEQ.colW + SEQ.gap), SEQ.y0 + r * (SEQ.rowH + SEQ.rowGap), SEQ.colW, SEQ.rowH, c === 0 ? TEAL : INDIGO_L));
  add(2, g => { g.push(); g.stroke(GREY); g.strokeWeight(2); g.noFill(); const y = seqBottom + 12, x1 = SEQ.x0 + SEQ.colW + SEQ.gap; g.line(x1, y, seqRight, y); g.line(x1, y - 7, x1, y); g.line(seqRight, y - 7, seqRight, y); g.pop(); });
  add(2, g => { for (let k = 0; k < 5; k++) { const y = TOK.y + 40 + k * ((TOK.h - 80) / 4); g.push(); g.noStroke(); g.fill(k === 0 ? INDIGO_L : '#E8E8E8'); g.rect(TOK.x + 14, y - 10, TOK.w - 28, 20, 4); g.pop(); } });   // the token's D slots, schematic
  // ---- stage 3: illustrations ----
  add(3, g => img(g, 'rig_moose', 60, 112, 290));
  add(3, g => img(g, 'rig_gharial', 50, 330, 165)); add(3, g => img(g, 'rig_lemur', 240, 318, 165));
  SUB.forEach(sb => { if (sb.icon) add(3, g => miniGrid(g, BLK.x + 48, sb.y + 92, sb.icon, INDIGO)); });
  add(3, g => img(g, 'bias', BLK.x + BLK.w - 30 - 68, SUB[1].y + 88, 64));
  [[1404, 150], [1490, 150], [1576, 150], [1662, 150]].forEach(([x, y], k) => add(3, g => img(g, 'clean_' + k, x, y, 82)));
  add(3, g => img(g, 'motion_strip', 1400, 318, 350));
  add(3, g => img(g, 'skinned_moose', 1470, 512, 190));
  add(3, g => treeIcon(g, treeXY[0], treeXY[1], TEAL));
  // ---- stage 4: connections ----
  add(4, g => line(g, [[STRIP.x + STRIP.w + 6, STRIP.y + STRIP.h / 2], [466, STRIP.y + STRIP.h / 2], [466, bLin.cy], [bLin.x - 6, bLin.cy]], INK, 3.5, 14));                     // 17 channels -> linear
  for (const b of [bLin, bPos, bSlot, bMask, bLLMa, bTree]) add(4, g => line(g, [[b.x + b.w + 4, b.cy], [TOK.x - 6, b.cy]], b === bLLMa || b === bTree ? TEAL : (b === bMask ? INDIGO : INK), 3, 12));
  add(4, g => line(g, [[bDesc.x + 60, bDesc.y + bDesc.h + 4], [bDesc.x + 60, bLLMa.y - 6]], TEAL, 3, 12));                         // description -> encoder
  add(4, g => line(g, [[treeXY[0] + 30, treeXY[1]], [bTree.x - 6, treeXY[1]]], TEAL, 3, 12));
  add(4, g => line(g, [[TOK.x + TOK.w + 8, 205], [BLK.x - 6, 205]], INK, 5, 18));                                                 // tokens -> transformer
  add(4, g => { for (let i = 0; i < 2; i++) { const a = SUB[i], b = SUB[i + 1]; line(g, [[BLK.x + BLK.w / 2, a.y + a.h + 2], [BLK.x + BLK.w / 2, b.y - 2]], INK, 3, 10); } line(g, [[BLK.x + BLK.w / 2, SUB[2].y + SUB[2].h + 2], [BLK.x + BLK.w / 2, bHead.y - 4]], INK, 3, 10); });
  add(4, g => line(g, [[bHead.x + bHead.w + 4, bHead.cy], [1375, bHead.cy], [1375, 192], [1398, 192]], INK, 5, 18));            // head -> clean prediction
  add(4, g => line(g, [[1748, 150], [1748, 118], [bLin.x + 40, 118], [bLin.x + 40, bLin.y - 6]], INDIGO, 3.5, 14));           // Euler return: the updated frames are re-embedded every step
  add(4, g => line(g, [[1404 + 12, 236], [1404 + 12, 306]], INK, 4, 14));                                                          // after 20 steps -> motion
  add(4, g => line(g, [[1404 + 12, 460], [1404 + 12, 500]], INK, 4, 14));                                                          // -> FK -> skinned
  add(4, g => { line(g, [[RAIL_X, plusC[1]], [RAIL_X, SUB[0].y + SUB[0].h / 2]], CLAY, 3.5, 0); for (const sb of SUB) { port(g, RAIL_X, sb.y + sb.h / 2); line(g, [[RAIL_X + 11, sb.y + sb.h / 2], [BLK.x + 24, sb.y + sb.h / 2]], CLAY, 3, 10); } port(g, RAIL_X, bHead.cy); line(g, [[RAIL_X + 11, bHead.cy], [BLK.x + 54, bHead.cy]], CLAY, 3, 10); });
  add(4, g => line(g, [[bCap.x + 60, bCap.y + bCap.h + 4], [bCap.x + 60, bLLMb.y - 6]], CLAY, 3, 12));
  add(4, g => line(g, [[bLLMb.x + bLLMb.w + 4, bLLMb.cy], [plusC[0], bLLMb.cy], [plusC[0], plusC[1] - 24]], CLAY, 3, 12));
  add(4, g => line(g, [[dialXY[0] + 22, dialXY[1]], [bMLPt.x - 6, dialXY[1]]], CLAY, 3, 12));
  add(4, g => line(g, [[bMLPt.x + bMLPt.w + 4, bMLPt.cy], [plusC[0], bMLPt.cy], [plusC[0], plusC[1] + 24]], CLAY, 3, 12));
  add(4, g => line(g, [[plusC[0] + 22, plusC[1]], [RAIL_X, plusC[1]]], CLAY, 3.5, 0));                                              // c -> AdaLN rail
  add(4, g => { plus(g, plusC[0], plusC[1], CLAY); dial(g, dialXY[0], dialXY[1]); });
  // ---- stage 5: labels ----
  add(5, g => txt(g, '311 rigs · 34–102 joints', 50, 466, 30, { col: GREY }));
  add(5, g => { txt(g, 'one joint, one token: 17 channels', STRIP.x, STRIP.y - 12, 30, { col: INK }); let x = STRIP.x, row = 0; CH.forEach((c, i) => { if (i === 3) { x = STRIP.x; row = 1; } const y = STRIP.y + STRIP.h + 22 + row * 30; g.push(); g.noStroke(); g.fill(c.col); g.circle(x + 7, y, 12); g.pop(); txt(g, c.lab, x + 18, y + 7, 22, { col: INK }); x += 18 + measure(g, c.lab, 22) + 22; }); });
  add(5, g => { txt(g, 'sequence', SEQ.x0, SEQ.y0 - 14, 30, { col: INK }); txt(g, 'rest', SEQ.x0 + SEQ.colW / 2, seqBottom + 44, 28, { col: TEAL, align: g.CENTER }); txt(g, '240 noisy target frames', (SEQ.x0 + SEQ.colW + SEQ.gap + seqRight) / 2, seqBottom + 44, 28, { col: INDIGO, align: g.CENTER }); txt(g, 'standardised per rig, joint, channel', SEQ.x0, seqBottom + 84, 26, { col: GREY }); });
  add(5, g => { txt(g, 'one D-dim token', TOK.x + TOK.w + 14, TOK.y + TOK.h / 2, 30, { col: INK, align: g.CENTER, rot: Math.PI / 2 }); });

function paint(g, p) {

    const ms = MARKS.filter(m => m.stage === k); const n = Math.floor(f * ms.length + eps);
    for (let i = 0; i < n; i++) ms[i].draw(g);
  }
}

function applyHash() { const q = parseHash(); if (q.stage) setP((+q.stage) / NSTAGE); else if (q.p !== undefined && q.p !== true) setP(+q.p); if (q.svg !== undefined) { document.body.classList.add('svgonly'); buildSVGSafe(false); } }
